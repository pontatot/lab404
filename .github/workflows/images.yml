name: Build images

on:
  push:
    paths:
      - "apps/**"
      - "mise.toml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions: {}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: hadolint

      - run: hadolint apps/web/Dockerfile apps/votes/Dockerfile

  build:
    name: Build ${{ matrix.service }} for ${{ matrix.arch }}
    needs: hadolint
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - id: image
        name: Set image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/lab404-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Record image reference
        env:
          REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: echo "$REF" > "${{ matrix.service }}-${{ matrix.arch }}.ref"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ref-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ matrix.service }}-${{ matrix.arch }}.ref
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: trivy

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ref-${{ matrix.service }}-${{ matrix.arch }}

      - name: Scan the platform digest
        env:
          NAME: ${{ matrix.service }}-${{ matrix.arch }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$(cat "$NAME.ref")"
          mkdir reports
          trivy image --format json --output "reports/trivy-$NAME.json" "$ref"
          trivy image --format cyclonedx --output "reports/sbom-$NAME.cdx.json" "$ref"
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$ref"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-${{ matrix.service }}-${{ matrix.arch }}
          path: reports/
          retention-days: 1

  dockle:
    name: Dockle ${{ matrix.service }} for ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [web, votes]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: dockle

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ref-${{ matrix.service }}-${{ matrix.arch }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --access-logfile is a Gunicorn flag that Dockle mistakes for a credential.
      - name: Check the platform digest
        env:
          NAME: ${{ matrix.service }}-${{ matrix.arch }}
        run: |
          ref="$(cat "$NAME.ref")"
          mkdir reports
          docker pull --platform "linux/${{ matrix.arch }}" "$ref"
          docker save --output image.tar "$ref"
          dockle --exit-code 1 --exit-level warn --accept-key=--access-logfile \
            --format json --output "reports/dockle-$NAME.json" --input image.tar

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-dockle-${{ matrix.service }}-${{ matrix.arch }}
          path: reports/
          retention-days: 1

  publish:
    name: Publish ${{ matrix.service }} index
    needs: [trivy, dockle]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ref-${{ matrix.service }}-*
          path: refs
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform index
        env:
          SERVICE: ${{ matrix.service }}
          MOVE_LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          image="$(cut -d@ -f1 refs/*.ref | head -n1)"
          tags=(--tag "$image:sha-$GITHUB_SHA")
          if [ "$MOVE_LATEST" = true ]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" $(cat refs/*.ref)
          mkdir reports
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" | tee "reports/index-$SERVICE.txt"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:sha-$GITHUB_SHA" | jq -r .digest)"
          echo "$image@$digest" > "$SERVICE.index"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-index-${{ matrix.service }}
          path: reports/
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-${{ matrix.service }}
          path: ${{ matrix.service }}.index
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign ${{ matrix.service }} index
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [web, votes]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-${{ matrix.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the index and its manifests
        env:
          SERVICE: ${{ matrix.service }}
        run: cosign sign --yes --recursive "$(cat "$SERVICE.index")"

      - name: Verify the index and both platform manifests
        env:
          SERVICE: ${{ matrix.service }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          ref="$(cat "$SERVICE.index")"
          image="${ref%@*}"
          children="$(docker buildx imagetools inspect --raw "$ref" | jq -r '.manifests[] | select(.platform.os == "linux") | .digest')"
          test "$(echo "$children" | wc -l)" -eq 2
          for target in "$ref" $(printf "$image@%s " $children); do
            cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$target" > /dev/null
            echo "verified $target"
          done

  evidence:
    name: Upload evidence
    needs: publish
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: evidence
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
