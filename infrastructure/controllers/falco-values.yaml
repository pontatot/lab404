driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

# Use the rules bundled with the pinned Falco image instead of fetching
# floating rule artifacts at runtime.
falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false

falco:
  json_output: true
  stdout_output:
    enabled: true

tolerations:
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: workload
    operator: Equal
    value: stateful
    effect: NoSchedule
